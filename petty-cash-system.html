    r.reviewedBy = State.currentUser.fullName;
    r.reviewedAt = nowParts().iso;
    await storeSet(K.reimbursements, State.reimbursements);
    await logAudit('Reimbursement rejected', 'SUBMITTED', 'REJECTED', `${id} — ${reason}`);
    render();
  }));
  document.querySelectorAll('[data-action="reopen-reimbursement"]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const r = State.reimbursements.find(x=>x.id===id);
    if(!r || r.status!=='REJECTED') return;
    r.status = 'DRAFT';
    await storeSet(K.reimbursements, State.reimbursements);
    await logAudit('Reimbursement reopened to draft', 'REJECTED', 'DRAFT', id);
    render();
  }));
  document.querySelectorAll('[data-action="print-reimbursement"]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const r = State.reimbursements.find(x=>x.id===id);
    if(!r) return;
    if(reimbursementPrintBlocked()){
      alert('The latest cash count variance is more than GHS 10 — perform a fresh, closer cash count before downloading the authorization document.');
      return;
    }
    try{
      generateReimbursementPDF(r);
      await logAudit('Reimbursement PDF downloaded', '—', r.id);
    }catch(err){
      alert('Could not generate the PDF: ' + err.message);
    }
  }));
  document.querySelectorAll('[data-action="download-reimbursement-docx"]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const r = State.reimbursements.find(x=>x.id===id);
    if(!r) return;
    if(reimbursementPrintBlocked()){
      alert('The latest cash count variance is more than GHS 10 — perform a fresh, closer cash count before downloading the authorization document.');
      return;
    }
    try{
      await generateReimbursementDocx(r);
      await logAudit('Reimbursement Word document downloaded', '—', r.id);
    }catch(err){
      alert('Could not generate the Word document: ' + err.message);
    }
  }));
  const adjustmentForm = document.getElementById('adjustmentForm');
  if(adjustmentForm){
    adjustmentForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const id = adjustmentForm.dataset.id;
      const r = State.reimbursements.find(x=>x.id===id);
      if(!r || r.status!=='DRAFT') return;
      const fd = new FormData(adjustmentForm);
      const amount = Number(fd.get('adjustmentAmount'))||0;
      const reason = fd.get('adjustmentReason').trim();
      if(amount > 0 && !reason){ alert('Add a reason for the adjustment (e.g. "Resetting float to GHS 50,000").'); return; }
      if(amount > r.totalAmount){ alert(`Adjustment (${fmtGHS(amount)}) can't be more than Amount Spent (${fmtGHS(r.totalAmount)}).`); return; }
      const before = { adjustmentAmount:r.adjustmentAmount, adjustmentReason:r.adjustmentReason };
      r.adjustmentAmount = amount;
      r.adjustmentReason = reason;
      const ok = await storeSet(K.reimbursements, State.reimbursements);
      if(!ok){
        r.adjustmentAmount = before.adjustmentAmount;
        r.adjustmentReason = before.adjustmentReason;
        alert(`⚠️ Could not confirm this was saved (${ConnectionState.lastError}). Try again.`);
        render();
        return;
      }
      await logAudit('Reimbursement adjustment set', before.adjustmentAmount?fmtGHS(before.adjustmentAmount):'—', amount?`${fmtGHS(amount)} — ${reason}`:'—', id);
      render();
    });
  }
  const reimbPayForm = document.getElementById('reimbPayForm');
  if(reimbPayForm){
    reimbPayForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const id = reimbPayForm.dataset.id;
      const r = State.reimbursements.find(x=>x.id===id);
      if(!r || r.status!=='APPROVED') return;
      const fd = new FormData(reimbPayForm);
      r.paidRef = fd.get('paidRef').trim();
      r.paidDate = fd.get('paidDate');
      r.status = 'PAID';
      r.paidBy = State.currentUser.fullName;
      const netAmount = reimbursementNetAmount(r);
      // credit the ledger with the net reimbursement amount (Amount Spent
      // minus any one-time adjustment), not necessarily the raw total spent
      const txnId = await nextNumber('txn');
      const {date, time, iso} = nowParts();
      const creditTxn = {
        id:txnId, type:'REIMBURSEMENT', date:r.paidDate, amount:netAmount,
        remarks:`Reimbursement ${r.id} — Ref ${r.paidRef}${r.adjustmentAmount?` (net of ${fmtGHS(r.adjustmentAmount)} adjustment)`:''}`, status:'POSTED',
        userId:State.currentUser.id, userName:State.currentUser.fullName,
        dateCreated:date, timeCreated:time, createdAt:iso, reimbursementRequestId:r.id,
        batchNumber: (activeBatch() ? activeBatch().batchNumber : ''),
      };
      State.transactions.push(creditTxn);
      await storeSet(K.reimbursements, State.reimbursements);
      await storeSet(K.transactions, State.transactions);
      await logAudit('Reimbursement paid', 'APPROVED', 'PAID', `${id} — ${fmtGHS(netAmount)} — Ref ${r.paidRef}`);
      render();
    });
  }

  // ---- reports ----
  document.querySelectorAll('[data-report-tab]').forEach(t=>t.addEventListener('click', ()=>{
    State.activeTab.reports = t.getAttribute('data-report-tab');
    render();
  }));
  const applyFilterBtn = document.querySelector('[data-action="apply-report-filter"]');
  if(applyFilterBtn){
    applyFilterBtn.addEventListener('click', ()=>{
      State.reportFilters.from = document.getElementById('reportFrom').value;
      State.reportFilters.to = document.getElementById('reportTo').value;
      render();
    });
  }
  const clearFilterBtn = document.querySelector('[data-action="clear-report-filter"]');
  if(clearFilterBtn){
    clearFilterBtn.addEventListener('click', ()=>{
      State.reportFilters = {from:'', to:''};
      render();
    });
  }
  const exportBtn = document.querySelector('[data-action="export-report"]');
  if(exportBtn){
    exportBtn.addEventListener('click', ()=>{
      const tab = State.activeTab.reports;
      const txns = filteredExpenseTxns();
      const stamp = new Date().toISOString().slice(0,10);
      if(tab==='account'){
        const lines = groupByAccount(txns);
        downloadCSV(`expenses-by-account-${stamp}.csv`, [['Code','Account','Amount'], ...lines.map(l=>[l.code,l.name,l.amount.toFixed(2)])]);
      } else if(tab==='department'){
        const map = {};
        txns.forEach(t=>{ const d=t.department||'Unassigned'; map[d]=(map[d]||0)+Number(t.amount||0); });
        downloadCSV(`expenses-by-department-${stamp}.csv`, [['Department','Amount'], ...Object.entries(map).map(([d,a])=>[d,a.toFixed(2)])]);
      } else {
        downloadCSV(`transactions-${stamp}.csv`, [
          ['Txn ID','Date','Recipient','Description','Department','Account Code','Account Name','Batch','Voucher','Amount','Status','User'],
          ...txns.map(t=>[t.id,t.date,t.recipient,t.description,t.department||'',t.accountCode,t.accountName,t.batchNumber||'',t.voucher||'',Number(t.amount||0).toFixed(2),t.status,t.userName]),
        ]);
      }
    });
  }

  // account actions
  document.querySelectorAll('[data-action="new-account"]').forEach(b=>b.addEventListener('click', ()=>{
    State.modal = {type:'account', mode:'new', data:{}};
    render();
  }));
  document.querySelectorAll('[data-action="edit-account"]').forEach(b=>b.addEventListener('click', ()=>{
    const code = b.getAttribute('data-code');
    const acc = State.accounts.find(a=>a.code===code);
    State.modal = {type:'account', mode:'edit', data:{...acc}};
    render();
  }));
  document.querySelectorAll('[data-action="toggle-account"]').forEach(b=>b.addEventListener('click', async ()=>{
    const code = b.getAttribute('data-code');
    const acc = State.accounts.find(a=>a.code===code);
    const oldVal = acc.active ? 'ACTIVE' : 'INACTIVE';
    acc.active = !acc.active;
    const ok = await storeSet(K.accounts, State.accounts);
    if(!ok){
      acc.active = !acc.active; // roll back
      alert(`⚠️ Could not confirm this change was saved (${ConnectionState.lastError}). Try again.`);
      render();
      return;
    }
    await logAudit('Account code status changed', oldVal, acc.active?'ACTIVE':'INACTIVE', `Code ${code}`);
    render();
  }));
  document.querySelectorAll('[data-action="open-import-accounts"]').forEach(b=>b.addEventListener('click', ()=>{
    State.modal = {type:'import-accounts'};
    render();
  }));
  const importAccountsForm = document.getElementById('importAccountsForm');
  if(importAccountsForm){
    importAccountsForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const raw = new FormData(importAccountsForm).get('csv');
      let parsed;
      try{ parsed = parseAccountsCSV(raw); }
      catch(err){ alert('Could not read that CSV: ' + err.message); return; }
      if(parsed.length===0){ alert('No account rows found.'); return; }
      const before = JSON.parse(JSON.stringify(State.accounts));
      let added=0, updated=0;
      parsed.forEach(row=>{
        const existing = State.accounts.find(a=>a.code===row.code);
        if(existing){
          if(existing.name!==row.name || existing.category!==row.category) updated++;
          existing.name = row.name;
          existing.category = row.category;
          // active status intentionally preserved, not overwritten
        } else {
          State.accounts.push({ code:row.code, name:row.name, category:row.category, active: row.active });
          added++;
        }
      });
      const ok = await storeSet(K.accounts, State.accounts);
      if(!ok){
        State.accounts = before; // roll back — the import never actually saved
        alert(`⚠️ Could not confirm this import was saved (${ConnectionState.lastError}). Nothing was changed — check your connection and try again.`);
        render();
        return;
      }
      await logAudit('Chart of Accounts imported', '—', `${added} added, ${updated} updated`);
      State.modal = null;
      alert(`Import confirmed and saved: ${added} new account(s) added, ${updated} existing account(s) updated.`);
      render();
    });
  }

  document.querySelectorAll('[data-action="open-upload-txn"]').forEach(b=>b.addEventListener('click', ()=>{
    if(!activeBatch()){ alert('Select or start a batch before uploading transactions.'); return; }
    State.modal = {type:'upload-txn'};
    render();
  }));

  const downloadTemplateBtn = document.querySelector('[data-action="download-txn-template"]');
  if(downloadTemplateBtn){
    downloadTemplateBtn.addEventListener('click', ()=>{
      const today = new Date().toISOString().slice(0,10);
      const sampleAccount = State.accounts.find(a=>a.active) || {code:'32001'};
      const aoa = [
        ['Date','Recipient','Description','Department','Account Code','Voucher','Amount'],
        [today,'Jane Doe','Sample office supplies purchase','Admin',sampleAccount.code,'V-0001',150.00],
      ];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [{wch:12},{wch:18},{wch:30},{wch:14},{wch:14},{wch:12},{wch:10}];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
      XLSX.writeFile(wb, 'petty-cash-transaction-template.xlsx');
    });
  }

  const doUploadBtn = document.querySelector('[data-action="do-upload-txn"]');
  if(doUploadBtn){
    doUploadBtn.addEventListener('click', async ()=>{
      const b = activeBatch();
      if(!b){ alert('Your working batch is no longer open. Select or start a batch, then try again.'); State.modal=null; render(); return; }
      const fileInput = document.getElementById('txnFileInput');
      const file = fileInput && fileInput.files[0];
      if(!file){ alert('Choose an Excel or CSV file first.'); return; }
      const statusEl = document.getElementById('uploadTxnStatus');
      if(statusEl) statusEl.textContent = 'Reading file…';

      let rowsRaw;
      try{
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        rowsRaw = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      }catch(err){
        if(statusEl) statusEl.textContent = '';
        alert('Could not read that file — make sure it\'s a valid .xlsx, .xls, or .csv file.');
        return;
      }

      const { rows, errors } = parseTransactionRows(rowsRaw);
      if(rows.length===0){
        if(statusEl) statusEl.textContent = '';
        alert('No valid rows found in that file.' + (errors.length ? '\n\n' + errors.slice(0,10).join('\n') : ''));
        return;
      }

      // Generate all transaction IDs locally, then save settings once — avoids
      // one slow round-trip per row for potentially dozens of uploaded rows.
      const s = State.settings.numbering;
      const year = new Date().getFullYear();
      let seq = s.nextTxnSeq;
      const {date:today, time, iso} = nowParts();
      const newTxns = rows.map(row=>{
        const id = `${s.txnPrefix}-${year}-${String(seq).padStart(6,'0')}`;
        seq++;
        return {
          id, type:'EXPENSE', date:row.date, recipient:row.recipient, description:row.description,
          department:row.department, accountCode:row.accountCode, accountName:row.account.name, accountCategory:row.account.category||'',
          batchNumber:b.batchNumber, voucher:row.voucher, amount:row.amount, status:'DRAFT',
          userId:State.currentUser.id, userName:State.currentUser.fullName, dateCreated:today, timeCreated:time, createdAt:iso,
        };
      });
      s.nextTxnSeq = seq;
      State.transactions.push(...newTxns);
      const ok1 = await storeSet(K.settings, State.settings);
      const ok2 = await storeSet(K.transactions, State.transactions);
      if(!ok1 || !ok2){
        State.transactions.splice(State.transactions.length - newTxns.length, newTxns.length);
        s.nextTxnSeq = seq - newTxns.length;
        if(statusEl) statusEl.textContent = '';
        alert(`⚠️ Could not confirm this upload was saved (${ConnectionState.lastError}). Nothing was created — check your connection and try again.`);
        render();
        return;
      }
      await refreshBatch(b.batchNumber);
      const total = newTxns.reduce((sum,t)=>sum+Number(t.amount||0),0);
      await logAudit('Transactions uploaded', '—', `${newTxns.length} row(s), ${fmtGHS(total)} — Batch ${b.batchNumber}`, errors.length ? `${errors.length} row(s) skipped` : '');
      State.modal = null;
      let msg = `Uploaded ${newTxns.length} transaction(s) into ${b.batchNumber}.`;
      if(errors.length) msg += `\n\n${errors.length} row(s) skipped:\n` + errors.slice(0,10).join('\n') + (errors.length>10 ? `\n…and ${errors.length-10} more.` : '');
      alert(msg);
      render();
    });
  }

  // user actions
  document.querySelectorAll('[data-action="new-user"]').forEach(b=>b.addEventListener('click', ()=>{
    State.modal = {type:'user', mode:'new', data:{}};
    render();
  }));
  document.querySelectorAll('[data-action="edit-user"]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.getAttribute('data-id');
    const u = State.users.find(x=>x.id===id);
    State.modal = {type:'user', mode:'edit', data:{...u}};
    render();
  }));
  document.querySelectorAll('[data-action="toggle-user"]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const u = State.users.find(x=>x.id===id);
    if(u.id === State.currentUser.id){ alert("You can't disable your own account while logged in."); return; }
    const oldVal = u.status;
    u.status = u.status==='Active' ? 'Disabled' : 'Active';
    await storeSet(K.users, State.users);
    await logAudit('User status changed', oldVal, u.status, `User ${u.username}`);
    render();
  }));
  document.querySelectorAll('[data-action="reset-pw"]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const u = State.users.find(x=>x.id===id);
    const newPw = prompt(`Enter a new temporary password for ${u.username} (min ${State.settings.security.minPasswordLength} chars):`);
    if(newPw === null) return;
    if(newPw.length < State.settings.security.minPasswordLength){ alert('Password too short.'); return; }
    u.passwordHash = hashPass(newPw);
    const ok = await storeSet(K.users, State.users);
    if(!ok){
      alert(`⚠️ Could not confirm the password reset was saved (${ConnectionState.lastError}). The officer's old password is likely still active. Check your internet connection and try the reset again — do not share the new password until this succeeds.`);
      render();
      return;
    }
    await logAudit('Password reset', '—', '—', `User ${u.username}`);
    alert('Password reset confirmed and saved. Share the new temporary password with the user securely.');
    render();
  }));

  // settings tabs + form
  document.querySelectorAll('[data-settings-tab]').forEach(t=>t.addEventListener('click', ()=>{
    State.activeTab.settings = t.getAttribute('data-settings-tab');
    render();
  }));
  const settingsForm = document.getElementById('settingsForm');
  if(settingsForm){
    settingsForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(settingsForm);
      const before = JSON.parse(JSON.stringify(State.settings));

      // Logo needs special handling — file inputs don't fit the generic
      // string-based settings loop below, so it's processed first.
      const logoFileInput = document.getElementById('logoFileInput');
      const logoFile = logoFileInput && logoFileInput.files[0];
      if(fd.get('company.removeLogo') === 'on'){
        State.settings.company.logoDataUrl = null;
        State.settings.company.logoW = null;
        State.settings.company.logoH = null;
      } else if(logoFile){
        try{
          const resized = await resizeImageFile(logoFile, 320);
          State.settings.company.logoDataUrl = resized.dataUrl;
          State.settings.company.logoW = resized.width;
          State.settings.company.logoH = resized.height;
        }catch(err){
          alert('Could not process that logo image: ' + err.message);
          return;
        }
      }

      for(const [key, val] of fd.entries()){
        if(key === 'company.logoFile' || key === 'company.removeLogo') continue;
        if(key === 'departments'){
          State.settings.departments = val.split('\n').map(x=>x.trim()).filter(Boolean);
          continue;
        }
        setDeep(State.settings, key, val);
      }
      // audit-worthy fields
      if(String(before.pettyCash.approvedFloat) !== String(State.settings.pettyCash.approvedFloat)){
        await logAudit('Approved float changed', fmtGHS(before.pettyCash.approvedFloat), fmtGHS(State.settings.pettyCash.approvedFloat));
      }
      if(String(before.pettyCash.reimbursementThreshold) !== String(State.settings.pettyCash.reimbursementThreshold)){
        await logAudit('Reimbursement threshold changed', fmtGHS(before.pettyCash.reimbursementThreshold), fmtGHS(State.settings.pettyCash.reimbursementThreshold));
      }
      const ok = await storeSet(K.settings, State.settings);
      if(!ok){
        State.settings = before; // roll back — nothing was actually saved
        alert(`⚠️ Could not confirm these settings were saved (${ConnectionState.lastError}). Nothing was changed — check your connection and try again.`);
        render();
        return;
      }
      await logAudit('Settings updated', '—', State.activeTab.settings + ' tab');
      alert('Settings confirmed and saved.');
      render();
    });
  }

  // modal close
  document.querySelectorAll('[data-close-modal]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.hasAttribute('data-close-modal')){ State.modal = null; render(); }
  }));
  document.querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('click', e=>e.stopPropagation()));

  // account form submit
  const accountForm = document.getElementById('accountForm');
  if(accountForm){
    accountForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(accountForm);
      const code = fd.get('code').trim();
      const name = fd.get('name').trim();
      const category = fd.get('category').trim();
      if(State.modal.mode === 'new'){
        if(State.accounts.some(a=>a.code===code)){ alert('That account code already exists.'); return; }
        State.accounts.push({code, name, category, active:true});
        const ok = await storeSet(K.accounts, State.accounts);
        if(!ok){
          State.accounts.pop();
          alert(`⚠️ Could not confirm this account was saved (${ConnectionState.lastError}). Nothing was created — try again.`);
          render();
          return;
        }
        await logAudit('Account code created', '—', `${code} — ${name}`);
      } else {
        const acc = State.accounts.find(a=>a.code===code);
        const oldName = acc.name, oldCategory = acc.category;
        acc.name = name;
        acc.category = category;
        const ok = await storeSet(K.accounts, State.accounts);
        if(!ok){
          acc.name = oldName; acc.category = oldCategory;
          alert(`⚠️ Could not confirm these changes were saved (${ConnectionState.lastError}). Nothing was changed — try again.`);
          render();
          return;
        }
        if(oldName !== name) await logAudit('Account code changed', oldName, name, `Code ${code}`);
      }
      State.modal = null;
      render();
    });
  }

  // user form submit
  const userForm = document.getElementById('userForm');
  if(userForm){
    userForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(userForm);
      const username = fd.get('username').trim();
      const fullName = fd.get('fullName').trim();
      const role = fd.get('role');
      if(State.modal.mode === 'new'){
        if(State.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ alert('That username already exists.'); return; }
        const password = fd.get('password');
        if(password.length < State.settings.security.minPasswordLength){ alert('Password too short.'); return; }
        const newUser = {id:uid('USR'), username, passwordHash:hashPass(password), fullName, role, status:'Active', createdAt:nowParts().iso, lastLogin:null};
        State.users.push(newUser);
        const ok = await storeSet(K.users, State.users);
        if(!ok){
          State.users.pop(); // roll back the local addition, since it never actually saved
          alert(`⚠️ Could not confirm this user was saved (${ConnectionState.lastError}). Nothing was created — check your connection and try again.`);
          render();
          return;
        }
        await logAudit('User created', '—', `${username} (${role})`);
      } else {
        const u = State.users.find(x=>x.username===username);
        const oldRole = u.role;
        const prevFullName = u.fullName, prevRole = u.role;
        u.fullName = fullName;
        u.role = role;
        const ok = await storeSet(K.users, State.users);
        if(!ok){
          u.fullName = prevFullName; u.role = prevRole; // roll back
          alert(`⚠️ Could not confirm these changes were saved (${ConnectionState.lastError}). Nothing was changed — check your connection and try again.`);
          render();
          return;
        }
        if(oldRole !== role) await logAudit('User role changed', oldRole, role, `User ${username}`);
        else await logAudit('User details edited', '—', username);
      }
      State.modal = null;
      render();
    });
  }
}

function bindSearch(id, filterKey){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{
    State.filters[filterKey] = el.value;
    render();
    // refocus + restore cursor after re-render
    const again = document.getElementById(id);
    if(again){ again.focus(); again.selectionStart = again.selectionEnd = again.value.length; }
  });
}

function setDeep(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  const lastKey = parts[parts.length-1];
  const original = cur[lastKey];
  if(typeof original === 'number'){ cur[lastKey] = Number(value); }
  else if(value === 'true' || value === 'false'){ cur[lastKey] = value === 'true'; }
  else { cur[lastKey] = value; }
}

async function doLogout(){
  await logAudit('User logout', '—', State.currentUser.username);
  State.currentUser = null;
  State.view = 'login';
  render();
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------- boot ---------------- */
(async function boot(){
  render();
  await seedIfNeeded();
  render();
})();
</script>
