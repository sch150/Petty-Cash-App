<style>
  :root{
    --ink:#1B2430;
    --ink-2:#232F40;
    --ink-3:#2E3B4E;
    --paper:#F5F3EE;
    --paper-2:#FFFFFF;
    --line:#DCD6C6;
    --line-soft:#EAE6D9;
    --gold:#A9791F;
    --gold-bg:#F4E9CF;
    --green:#2F6E51;
    --green-bg:#E4EFE7;
    --red:#A83B2E;

  }
  *{box-sizing:border-box;}

    font-family:var(--sans);
    background:var(--paper);
    color:var(--text);

  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(169,121,31,0.10), transparent 45%),
      var(--ink);
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:400px;
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:40px 36px 32px;
  }
  .login-mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--gold);
    margin-bottom:6px;
  }
  .login-title{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    line-height:1.25;
    margin:0 0 4px;
    color:var(--ink);
  }
  .login-sub{
    font-size:13.5px;
    color:var(--text-muted);
    margin:0 0 28px;
    line-height:1.5;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-2);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:10px 12px;
    font-family:var(--sans);
    font-size:14px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:-1px;
  }
  .field .hint{font-size:11.5px;color:var(--text-muted);margin-top:5px;}
  .btn{
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:600;
    padding:10px 18px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--text-inverse);
    cursor:pointer;
    transition:opacity .12s ease;
  }
  .btn:hover{opacity:.85;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--red);border-color:var(--red);}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#2A1D04;}
  .btn-sm{padding:6px 12px;font-size:12.5px;}

    #printArea table{width:100%;border-collapse:collapse;}
    #printArea th, #printArea td{border:1px solid #999;padding:6px 8px;font-size:12px;text-align:left;}
  }
</style>

<script>
/* =========================================================================
   PETTY CASH CONTROL & BATCH POSTING SYSTEM — PHASE 1 (Foundation)
   Modules: Login/RBAC, Dashboard shell, Account Master, Users, Settings, Audit Log
   Data is stored via window.storage (shared = visible to every role/session).
   ========================================================================= */

const SHARED = true;
const K = {
  users: 'pettycash:users',
  accounts: 'pettycash:accounts',
  settings: 'pettycash:settings',
  audit: 'pettycash:auditlog',
  transactions: 'pettycash:transactions',
  batches: 'pettycash:batches',
  cashCounts: 'pettycash:cashcounts',
  reimbursements: 'pettycash:reimbursements',
};

let State = {
  loaded: false,
  loadState: 'loading',
  view: 'login',
  currentUser: null,
  loginError: '',
  users: [],
  accounts: [],
  settings: null,
  auditLog: [],
  transactions: [],
  batches: [],
  cashCounts: [],
  reimbursements: [],
  editingTxnId: null,
  postingSummaryBatch: null,
  activeReimbursementId: null,
  modal: null,        // {type:'user'|'account', mode:'new'|'edit', data:{}}
  activeTab: {settings: 'company', reports: 'account'},
  reportFilters: {from:'', to:''},
  activeBatchNumber: '',
  uploadPreview: null,
  filters: {accounts:'', users:'', audit:'', txn:'', batches:''},
  txnShowAll: false,
};

/* ---------------- storage helpers ---------------- */
/* ---------------- BACKEND CONFIG ----------------
   Paste your deployed Apps Script Web App URL and secret token here.
   See the setup guide for how to get these two values. */
const BACKEND = {
  url: 'https://script.google.com/macros/s/AKfycbwaTRs4HLgAOWEjHVNi2-H1od1MQbBl4jpa9e41Yn3Hl3OMoeYKPg9oJr_Q3r8K9QF2-Q/exec',
  token: 'finSka$2026',
};
const ConnectionState = { ok: true, lastError: '' };

function backendConfigured(){
  return BACKEND.url && !BACKEND.url.includes('PASTE_YOUR') && BACKEND.token && !BACKEND.token.includes('PASTE_YOUR');
}

/* Reads use JSONP (a <script> tag), which browsers never subject to CORS —
   this is what makes reads reliable regardless of the POST/CORS limitation. */
let _jsonpCounter = 0;
function jsonpRequest(params){
  return new Promise((resolve, reject)=>{
    const cbName = 'gasCb' + (_jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let done = false;
    const cleanup = ()=>{
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    };
    window[cbName] = (data)=>{ done = true; cleanup(); resolve(data); };
    const timer = setTimeout(()=>{ if(!done){ cleanup(); reject(new Error('Request timed out')); } }, 25000);
    script.onerror = ()=>{ if(!done){ cleanup(); reject(new Error('Could not reach backend')); } };
    const qs = new URLSearchParams({ ...params, token: BACKEND.token, callback: cbName }).toString();
    script.src = BACKEND.url + '?' + qs;
    document.head.appendChild(script);
  });
}
async function storeGet(key, fallback){
  try{
    const r = await jsonpRequest({ action:'get', key });
    if(r.error) throw new Error(r.error);
    ConnectionState.ok = true;
    return (r.value===null || r.value===undefined || r.value==='') ? fallback : JSON.parse(r.value);
  }catch(e){
    ConnectionState.ok = false; ConnectionState.lastError = String(e);
    console.error('storage get failed', key, e);
    return fallback;
  }
}
/* Writes use fetch in "no-cors" mode: the request is genuinely sent and
   processed by Apps Script (confirmed working), we just can't read the
   response back — which is fine, since we don't need to for a save. */
async function storeSet(key, value, _isRetry){
  const serialized = JSON.stringify(value);
  try{
    await fetch(BACKEND.url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'set', key, value: serialized, token: BACKEND.token }),
    });
  }catch(e){
    ConnectionState.ok = false; ConnectionState.lastError = 'Could not reach backend: ' + String(e);
    console.error('storage set failed (network)', key, e);
    return false;
  }
  // no-cors writes always "succeed" from the browser's point of view even if
  // Google never received them — so read the value straight back to confirm
  // it actually landed, instead of assuming success.
  try{
    // Small pause before verifying — some of the "mismatch" failures are just
    // the read happening before the write has fully propagated, not a real
    // failure. Only applied on the first attempt, not the retry.
    if(!_isRetry) await new Promise(res=>setTimeout(res, 400));
    const r = await jsonpRequest({ action:'get', key });
    if(r.error) throw new Error(r.error);
    if(r.value !== serialized){
      if(!_isRetry){
        // One automatic retry: re-send the write and re-verify before
        // reporting a failure to the person.
        return await storeSet(key, value, true);
      }
      ConnectionState.ok = false;
      ConnectionState.lastError = 'Save could not be verified — the value in the Sheet does not match what was sent.';
      console.error('storage set unverified', key);
      return false;
    }
    ConnectionState.ok = true;
    return true;
  }catch(e){
    ConnectionState.ok = false; ConnectionState.lastError = 'Could not verify save: ' + String(e);
    console.error('storage set verification failed', key, e);
    return false;
  }
}

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }
function nowParts(){
  const d = new Date();
  return {
    date: d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}),
    time: d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}),
    iso: d.toISOString(),
  };
}
function hashPass(pw){
  // Lightweight obfuscation so passwords are never stored as plain text.
  // NOTE: not cryptographically secure — fine for an interim/offline tool,
  // should be replaced with proper server-side hashing in any networked deployment.
  let h = 0;
  for(let i=0;i<pw.length;i++){ h = (h*31 + pw.charCodeAt(i)) >>> 0; }
  return 'h' + h.toString(16) + ':' + pw.length;
}
function fmtGHS(n){
  const v = Number(n)||0;
  return 'GHS ' + v.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* ---------------- audit log ---------------- */
async function logAudit(action, oldValue, newValue, reason){
  const {date, time} = nowParts();
  const entry = {
    id: uid('AUD'),
    action,
    oldValue: oldValue===undefined||oldValue===null||oldValue==='' ? '—' : String(oldValue),
    newValue: newValue===undefined||newValue===null||newValue==='' ? '—' : String(newValue),
    user: State.currentUser ? State.currentUser.username : 'system',
    date, time,
    reason: reason || '',
  };
  State.auditLog.unshift(entry);
  await storeSet(K.audit, State.auditLog);
}

/* ---------------- seeding ---------------- */
/* Reads one key, distinguishing "genuinely empty/missing" from "request failed" —
   this distinction is what lets us tell a real fresh install apart from a
   temporary connection problem, so we never confuse the two. */
async function storeGetRaw(key){
  try{
    const r = await jsonpRequest({ action:'get', key });
    if(r.error) throw new Error(r.error);
    ConnectionState.ok = true;
    const value = (r.value===null || r.value===undefined || r.value==='') ? null : JSON.parse(r.value);
    return { ok:true, value };
  }catch(e){
    ConnectionState.ok = false; ConnectionState.lastError = String(e);
    console.error('storage get failed', key, e);
    return { ok:false, value:null };
  }
}

const DEMO_SEED = {
  users: ()=>[
    {id:uid('USR'), username:'admin', passwordHash:hashPass('Admin@123'), fullName:'System Administrator', role:'Admin', status:'Active', createdAt:nowParts().iso, lastLogin:null},
    {id:uid('USR'), username:'cashier', passwordHash:hashPass('Cash@123'), fullName:'Petty Cashier (Demo)', role:'Petty Cashier', status:'Active', createdAt:nowParts().iso, lastLogin:null},
    {id:uid('USR'), username:'reviewer', passwordHash:hashPass('Review@123'), fullName:'Reviewer / Approver (Demo)', role:'Reviewer/Approver', status:'Active', createdAt:nowParts().iso, lastLogin:null},
  ],
  accounts: ()=>[
    {code:'32001', name:'Printing & Stationery', category:'32000-ADMIN & GENERAL EXPENSES', active:true},
    {code:'32023', name:'Hotel & Accommodation', category:'32000-ADMIN & GENERAL EXPENSES', active:true},

async function seedIfNeeded(){
  const [users, accounts, settings, audit, transactions, batches, cashCounts, reimbursements] = await Promise.all([
    storeGetRaw(K.users), storeGetRaw(K.accounts), storeGetRaw(K.settings), storeGetRaw(K.audit),
    storeGetRaw(K.transactions), storeGetRaw(K.batches), storeGetRaw(K.cashCounts), storeGetRaw(K.reimbursements),
  ]);

  if([users, accounts, settings, audit, transactions, batches, cashCounts, reimbursements].some(r=>!r.ok)){
    // Could not confirm what's actually in the backend — never guess or write
    // in this state, since that's exactly how real data gets silently
    // overwritten by blank defaults. Block and let the person retry.
    State.loadState = 'error';
    State.loaded = true;
    return;
  }

  const usersEmpty = !users.value || users.value.length===0;
  const accountsEmpty = !accounts.value || accounts.value.length===0;
  const settingsEmpty = !settings.value;

  if(usersEmpty && accountsEmpty && settingsEmpty){
    // Nothing at all exists yet in any core table — genuinely looks like a
    // brand-new install. Still don't write anything automatically; require
    // an explicit, deliberate confirmation from the person before creating
    // any data.
    State.loadState = 'needs-init';
    State.loaded = true;
    return;
  }

  if(usersEmpty || accountsEmpty || settingsEmpty){
    // Some core data exists but not all of it — this is an anomaly (partial
    // read failure, wrong backend, corrupted row), never a real fresh
    // install. Block rather than silently filling in blanks over it.
    State.loadState = 'error';
    State.loaded = true;
    return;
  }

  State.users = users.value;
  State.accounts = accounts.value;
  State.settings = settings.value;
  State.auditLog = audit.value || [];
  State.transactions = transactions.value || [];
  State.batches = batches.value || [];
  State.cashCounts = cashCounts.value || [];
  State.reimbursements = reimbursements.value || [];
  State.loadState = 'ok';
  State.loaded = true;
}

/* ---------------- numbering ---------------- */
async function nextNumber(kind){
  const s = State.settings.numbering;
  if(kind === 'batch'){
    const seq = s.nextBatchSeq;
    const id = `${s.batchPrefix}B${String(seq).padStart(3,'0')}`;
    s.nextBatchSeq = seq + 1;
    await storeSet(K.settings, State.settings);
    return id;
  }
  const map = {
    txn:{prefix:'txnPrefix', seq:'nextTxnSeq'},
    reimb:{prefix:'reimbPrefix', seq:'nextReimbSeq'},
    cashcount:{prefix:'cashCountPrefix', seq:'nextCashCountSeq'},
  };
  const cfg = map[kind];
  const year = new Date().getFullYear();
  const seq = s[cfg.seq];
  const id = `${s[cfg.prefix]}-${year}-${String(seq).padStart(6,'0')}`;
  s[cfg.seq] = seq + 1;
  await storeSet(K.settings, State.settings);
  return id;
}

/* ---------------- batch helpers ---------------- */
function batchStats(batchNumber){
  const txns = State.transactions.filter(t=>t.batchNumber===batchNumber && t.status!=='VOIDED');
  const total = txns.reduce((s,t)=>s+Number(t.amount||0),0);
  return {count:txns.length, total};
}
async function refreshBatch(batchNumber){
  if(!batchNumber) return;
  const b = State.batches.find(x=>x.batchNumber===batchNumber);
  if(!b) return;
  const stats = batchStats(batchNumber);
  b.numTransactions = stats.count;
  b.totalAmount = stats.total;
  await storeSet(K.batches, State.batches);
}
async function setBatchStatus(batchNumber, newStatus){
  const b = State.batches.find(x=>x.batchNumber===batchNumber);
  if(!b) return;
  const old = b.status;
  b.status = newStatus;
  State.transactions.forEach(t=>{ if(t.batchNumber===batchNumber && t.status!=='VOIDED') t.status = newStatus; });
  await storeSet(K.batches, State.batches);
  await storeSet(K.transactions, State.transactions);
  await logAudit('Batch status changed', old, newStatus, `Batch ${batchNumber}`);
}
function groupByAccount(txns){
  const map = {};
  txns.forEach(t=>{
    if(t.status==='VOIDED') return;
    if(!map[t.accountCode]) map[t.accountCode] = {code:t.accountCode, name:t.accountName, amount:0};
    map[t.accountCode].amount += Number(t.amount||0);
  });
  return Object.values(map).sort((a,b)=>a.code.localeCompare(b.code));
}
function txnEditable(t){
  if(t.type==='REIMBURSEMENT') return false;
  if(t.status==='VOIDED') return false;
  if(!can('txn.create')) return false;
  const owner = State.currentUser.role==='Admin' || t.userId===State.currentUser.id;
  if(!owner) return false;
  // Editable all the way through batch submission, review and posting — only
  // locked once the reimbursement covering it has actually been paid.
  // Admins can still make corrections even after that point if truly needed.
  if(State.currentUser.role!=='Admin' && t.reimbursementId){
    const r = State.reimbursements.find(x=>x.id===t.reimbursementId);
    if(r && r.status==='PAID') return false;
  }
  return true;
}
function statusBadge(status){
  const map = {DRAFT:'neutral', SUBMITTED:'gold', 'UNDER REVIEW':'gold', APPROVED:'green', POSTED:'green', CLOSED:'neutral', REJECTED:'red', VOIDED:'red', REVERSED:'red'};
  return `<span class="badge badge-${map[status]||'neutral'}">${status}</span>`;
}
function openDraftBatches(){
  return State.batches.filter(b=>b.status==='DRAFT').slice().sort((a,b)=>b.batchNumber.localeCompare(a.batchNumber));
}
function activeBatch(){
  if(!State.activeBatchNumber) return null;
  const b = State.batches.find(x=>x.batchNumber===State.activeBatchNumber);
  return (b && b.status==='DRAFT') ? b : null;
}

  ).join('');

/* Running balance ledger: opening float, minus each EXPENSE, plus each REIMBURSEMENT, in date order. */
function computeLedger(){
  const rows = State.transactions.filter(t=>t.status!=='VOIDED')
    .slice().sort((a,b)=> (a.date+a.createdAt).localeCompare(b.date+b.createdAt));
  let running = State.settings.pettyCash.approvedFloat;
  const balanceById = {};
  rows.forEach(t=>{
    if(t.type==='BALANCE_RESET'){
      running = Number(t.amount||0); // manually verified cash on hand — overrides the running total
    } else {
      running += (t.type==='REIMBURSEMENT') ? Number(t.amount||0) : -Number(t.amount||0);
    }
    balanceById[t.id] = running;
  });
  return { balanceById, currentBalance: running };
}
function draftBatchOptions(selected){
  const drafts = State.batches.filter(b=>b.status==='DRAFT');
  return `<option value="">— Unassigned (assign later) —</option>` + drafts.map(b =>
    `<option value="${escapeAttr(b.batchNumber)}" ${b.batchNumber===selected?'selected':''}>${escapeHtml(b.batchNumber)} (${b.numTransactions} txns)</option>`
  ).join('');
}

    'reimb.create': ['Admin','Petty Cashier'],
    'reimb.review': ['Admin','Reviewer/Approver'],

  if(!table[perm]) return true;

    const password = document.getElementById('password').value;
    const user = State.users.find(u => u.username.toLowerCase() === username.toLowerCase());

  const thisMonth = new Date().toISOString().slice(0,7);
  const monthTotal = State.transactions
    .filter(t=>t.status!=='VOIDED' && t.type!=='REIMBURSEMENT' && t.date && t.date.slice(0,7)===thisMonth)
    .reduce((a,t)=>a+Number(t.amount||0),0);
  const { currentBalance } = computeLedger();
  const belowThreshold = currentBalance <= s.pettyCash.reimbursementThreshold;
  const pendingReimbursements = State.reimbursements.filter(r=>r.status==='SUBMITTED');

  return `
  <div class="page-head">
    <h1>Petty Cash Status</h1>
    <p>${nowParts().date} — Foundation, Transactions & Batches, Cash Control, and Reports are all live.</p>
  </div>

  ${can('reimb.review') && pendingReimbursements.length>0 ? `<div class="banner banner-info" style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <div><b>${pendingReimbursements.length} Reimbursement Request${pendingReimbursements.length>1?'s':''} Pending Your Review</b> — ${pendingReimbursements.map(r=>escapeHtml(r.id)).join(', ')}</div>
    <button type="button" class="btn btn-gold btn-sm" data-nav="reimbursement">Review Now</button>
  </div>` : ''}

  <div class="stat-row">
    <div class="stat">
      <div class="label">Approved Float</div>
      <div class="value">${fmtGHS(s.pettyCash.approvedFloat)}</div>
    </div>
    <div class="stat">
      <div class="label">Reimbursement Threshold</div>
      <div class="value">${fmtGHS(s.pettyCash.reimbursementThreshold)}</div>
    </div>
    <div class="stat">
      <div class="label">Current Ledger Balance</div>
      <div class="value" style="${belowThreshold?'color:var(--red);':''}">${fmtGHS(currentBalance)}</div>
      <div class="sub">Based on recorded transactions — physical cash count confirms this in Phase 3</div>
    </div>
    <div class="stat">
      <div class="label">Reimbursement Status</div>
      <div class="value" style="font-size:15px;">
        ${belowThreshold ? `<span class="badge badge-red">BELOW THRESHOLD</span>` : `<span class="badge badge-green">OK</span>`}
      </div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="label">Unposted Batches</div><div class="value">${unposted}</div></div>
    <div class="stat"><div class="label">Pending Approval</div><div class="value">${pending}</div></div>
    <div class="stat"><div class="label">Posted Batches</div><div class="value">${posted}</div></div>
    <div class="stat"><div class="label">Current Month Expenses</div><div class="value gold">${fmtGHS(monthTotal)}</div></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>What's live right now</h2></div>
    <div class="panel-body">
      <div class="form-grid">
        <div>
          <b>Available in this phase</b>
          <ul style="margin:8px 0 0;padding-left:18px;color:var(--text-muted);font-size:13.5px;line-height:1.9;">
            <li>Role-based login (Cashier / Reviewer / Admin)</li>
            <li>Account Master, Users, Settings, Audit Log (Admin)</li>
            <li>Transaction capture with auto-generated Transaction IDs</li>
            <li>Batch creation, submission, review, approval &amp; posting</li>
            <li>Auto-consolidated Posting Summary by account code</li>
          </ul>
        </div>
        <div>
          <b>Coming in later phases</b>
          <ul style="margin:8px 0 0;padding-left:18px;color:var(--text-muted);font-size:13.5px;line-height:1.9;">
            <li>Denomination cash count &amp; reconciliation</li>
            <li>Reimbursement threshold gate &amp; authorization printing</li>
            <li>Full reports library, Excel &amp; PDF export</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  `;
}

/* ---------------- TRANSACTION LEDGER (spreadsheet-style) ---------------- */
function renderLedger(){
  const { balanceById, currentBalance } = computeLedger();
  const threshold = State.settings.pettyCash.reimbursementThreshold;
  const belowThreshold = currentBalance <= threshold;
  const q = State.filters.txn.toLowerCase();
  const activeB = activeBatch();
  const showAll = State.txnShowAll || !!q; // a search always looks across everything, regardless of the toggle
  const all = State.transactions.slice().sort((a,b)=> (a.date+a.createdAt).localeCompare(b.date+b.createdAt));
  const rows = all.filter(t => t.status!=='VOIDED'
    && (showAll || t.type==='REIMBURSEMENT' || t.type==='BALANCE_RESET' || (activeB && t.batchNumber===activeB.batchNumber))
    && (!q || [t.id,t.batchNumber,t.voucher,t.recipient,t.accountCode,t.accountName,t.status,t.userName,t.department,t.description].join(' ').toLowerCase().includes(q))
  );

  return `
  <div class="page-head">
    <h1>Transaction Ledger</h1>
    <p>One line per transaction — pick the account and department from the dropdowns, type the rest, press Enter to save. Balance updates automatically and reflects your reimbursement threshold.</p>
  </div>

  ${can('txn.create') ? renderWorkingBatchBar() : ''}

  <div class="stat-row">
    <div class="stat"><div class="label">Approved Float</div><div class="value">${fmtGHS(State.settings.pettyCash.approvedFloat)}</div></div>
    <div class="stat"><div class="label">Current Balance</div><div class="value ${belowThreshold?'':'gold'}" style="${belowThreshold?'color:var(--red);':''}">${fmtGHS(currentBalance)}</div></div>
    <div class="stat"><div class="label">Reimbursement Threshold</div><div class="value">${fmtGHS(threshold)}</div></div>
    <div class="stat"><div class="label">Status</div><div class="value" style="font-size:15px;">
      ${belowThreshold ? `<span class="badge badge-red">BELOW THRESHOLD — REQUEST REIMBURSEMENT</span>` : `<span class="badge badge-green">OK</span>`}
    </div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="txnSearch" placeholder="Search recipient, account, batch, voucher, department…" value="${escapeAttr(State.filters.txn)}">
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);white-space:nowrap;">
      <input type="checkbox" id="txnShowAllToggle" style="width:auto;" ${State.txnShowAll?'checked':''}> Show all history (not just current batch)
    </label>
    ${can('reimbursement.record') ? `<button type="button" class="btn btn-ghost btn-sm" data-action="new-reimbursement">+ Record Reimbursement Received</button>` : ''}
    ${can('cash.correction') ? `<button type="button" class="btn btn-ghost btn-sm" data-action="new-cash-correction">+ Record Additional Cash (Correction)</button>` : ''}
    ${can('cash.balancereset') ? `<button type="button" class="btn btn-ghost btn-sm" data-action="new-balance-reset">⚖ Set Cash on Hand (Manual)</button>` : ''}
    ${can('txn.create') && activeBatch() ? `<button type="button" class="btn btn-ghost btn-sm" data-action="open-upload-txn">Upload Transactions</button>` : ''}
  </div>
  ${!showAll ? `<div class="note-box" style="margin-bottom:16px;">Showing only <b>${activeB?escapeHtml(activeB.batchNumber):'the current batch'}</b> plus any reimbursement credits. Reimbursed/older batches are hidden to keep this page fast to work with — tick "Show all history" above, or use Reports/View Batches, to see everything.</div>` : ''}

  <div class="panel">
    <div style="overflow-x:auto;">
    <form id="ledgerForm">
    <table style="min-width:1080px;">
      <thead><tr>
        <th style="width:120px;">Date</th>
        <th style="width:160px;">Recipient</th>
        <th style="width:220px;">Description / Purpose</th>
        <th style="width:120px;">Department</th>
        <th style="width:260px;">Expense Account</th>
        <th style="width:130px;">Batch</th>
        <th style="width:100px;">Voucher No.</th>
        <th style="width:110px;text-align:right;">Paid Amount</th>
        <th style="width:110px;text-align:right;">Reimbursement</th>
        <th style="width:110px;text-align:right;">Balance</th>
        <th style="width:70px;"></th>
      </tr></thead>
      <tbody>
        ${(showAll && !q) ? `<tr><td colspan="9" style="color:var(--text-muted);">Opening Balance</td><td style="text-align:right;font-weight:600;">${fmtGHS(State.settings.pettyCash.approvedFloat)}</td><td></td></tr>` : ''}
        ${(()=>{
          const batchesShown = [...new Set(rows.map(t=>t.batchNumber).filter(Boolean))];
          const dupIds = new Set();
          batchesShown.forEach(bn=>findDuplicateTxnIds(bn).forEach(id=>dupIds.add(id)));
          return rows.map(t => ledgerRow(t, balanceById[t.id], dupIds.has(t.id))).join('');
        })()}
        ${rows.length===0 && q ? `<tr class="empty-row"><td colspan="11">No transactions match your search.</td></tr>` : ''}
        ${can('txn.create') && activeBatch() ? ledgerNewRow() : ''}
      </tbody>
    </table>
    </form>
    </div>
  </div>
  <div class="note-box">Voided transactions are hidden from this ledger but never deleted — see them (and the reason) in the Audit Log. Rows lock automatically once their batch is submitted for review.</div>
  `;
}

function ledgerRow(t, balance, isDuplicate){
  if(t.type==='BALANCE_RESET'){
    return `
    <tr style="background:#e6ecf5;">
      <td>${t.date}</td>
      <td colspan="4" style="font-weight:600;color:#2d4a7a;">CASH ON HAND SET (MANUAL) ${t.remarks?'— '+escapeHtml(t.remarks):''}</td>
      <td class="mono">${t.batchNumber ? escapeHtml(t.batchNumber) : '<span style="color:var(--text-muted);">—</span>'}</td>
      <td></td>
      <td></td>
      <td style="text-align:right;font-weight:600;color:#2d4a7a;">→ ${fmtGHS(t.amount)}</td>
      <td style="text-align:right;font-weight:600;">${fmtGHS(balance)}</td>
      <td class="cell-actions">${can('txn.void') ? `<button type="button" class="btn btn-ghost btn-sm" data-action="void-txn" data-id="${escapeAttr(t.id)}">✕</button>` : ''}</td>
    </tr>`;
  }
  if(t.type==='REIMBURSEMENT'){
    const isCorrection = !!t.isCorrection;
    return `
    <tr style="background:${isCorrection?'var(--gold-bg)':'var(--green-bg)'};">
      <td>${t.date}</td>
      <td colspan="4" style="font-weight:600;color:${isCorrection?'#5c4413':'var(--green)'};">${isCorrection?'CASH CORRECTION':'REIMBURSEMENT RECEIVED'} ${t.remarks?'— '+escapeHtml(t.remarks):''}</td>
      <td class="mono">${t.batchNumber ? escapeHtml(t.batchNumber) : '<span style="color:var(--text-muted);">—</span>'}</td>
      <td></td>
      <td></td>
      <td style="text-align:right;font-weight:600;color:${isCorrection?'#5c4413':'var(--green)'};">${fmtGHS(t.amount)}</td>

/* ---------------- REIMBURSEMENT ---------------- */
function eligibleForReimbursement(batchNumber){
  const base = State.transactions.filter(t => t.type==='EXPENSE' && t.status!=='VOIDED' && !t.reimbursementId);
  return batchNumber ? base.filter(t=>t.batchNumber===batchNumber) : base;
}
function eligibleBatchesForReimbursement(){
  const map = {};
  eligibleForReimbursement().forEach(t=>{
    const bn = t.batchNumber || '(no batch)';
    if(!map[bn]) map[bn] = {batchNumber:bn, count:0, total:0};
    map[bn].count++;
    map[bn].total += Number(t.amount||0);
  });
  return Object.values(map).sort((a,b)=> a.batchNumber.localeCompare(b.batchNumber));
}
/* Flags likely-duplicate transactions within a batch: same voucher number
   AND same amount appearing more than once (blank vouchers are ignored,
   since many small unnumbered expenses legitimately share an amount). */
function findDuplicateTxnIds(batchNumber){
  const groups = {};
  State.transactions.filter(t=>t.batchNumber===batchNumber && t.type==='EXPENSE' && t.status!=='VOIDED' && t.voucher)
    .forEach(t=>{
      const key = t.voucher.trim().toLowerCase() + '|' + Number(t.amount||0).toFixed(2);
      if(!groups[key]) groups[key] = [];
      groups[key].push(t.id);
    });
  const dupIds = new Set();
  Object.values(groups).forEach(ids=>{ if(ids.length>1) ids.forEach(id=>dupIds.add(id)); });
  return dupIds;
}
function batchHasDuplicates(batchNumber){
  return findDuplicateTxnIds(batchNumber).size > 0;
}
/* The actual amount to be paid out — normally equal to Amount Spent, but can
   be netted down (or up) by a one-time adjustment, e.g. resetting the float
   to a new target amount. */
function reimbursementNetAmount(r){
  return Number(r.totalAmount||0) - Number(r.adjustmentAmount||0);
}
function truncateText(s, n){ s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }

function generateReimbursementPDF(r){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 48;
  let y = margin;
  const co = State.settings.company;
  const items = State.transactions.filter(t=>t.reimbursementId===r.id);
  const c = latestCashCount();
  const { currentBalance } = computeLedger();
  const cashOnHand = c ? c.totalCounted : currentBalance;
  const float = State.settings.pettyCash.approvedFloat;
  const amountSpent = r.totalAmount;

  function header(title){
    if(co.logoDataUrl && co.logoW && co.logoH){
      const maxW = 90, maxH = 34;
      const scale = Math.min(maxW/co.logoW, maxH/co.logoH, 1);
      const w = co.logoW*scale, h = co.logoH*scale;
      try{ doc.addImage(co.logoDataUrl, 'PNG', pageW-margin-w, margin-10, w, h); }catch(e){ /* ignore malformed image */ }
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(0);
    doc.text(co.name || 'Petty Cash', margin, y); y += 18;
    const addrLine = [co.address, co.phone].filter(Boolean).join('   ·   ');
    if(addrLine){
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
      doc.text(addrLine, margin, y); y += 16;
    }
    doc.setTextColor(0);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(title, pageW/2, y, { align:'center' });
    y += 10;
    doc.setLineWidth(0.7); doc.line(margin, y, pageW-margin, y);
    y += 24;
  }
  function labelValueRow(label, value){
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(label, margin, y);
    doc.setFont('helvetica','normal');
    doc.text(String(value), margin+230, y);
    y += 20;
  }
  function signLine(label, name){
    doc.setLineWidth(0.5);
    doc.line(margin, y, margin+230, y);
    doc.line(margin+280, y, margin+440, y);
    y += 12;
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text(label + (name ? ': ' + name : ''), margin, y);
    doc.text('Date', margin+280, y);
    y += 30;
  }

  // ---- PAGE 1: SUMMARY ----
  header('PETTY CASH REIMBURSEMENT — SUMMARY');
  labelValueRow('Request No.:', r.id);
  labelValueRow('Request Date:', r.requestDate);
  labelValueRow('Period Covered:', `${r.periodFrom} to ${r.periodTo}`);
  y += 8;
  doc.setLineWidth(0.4); doc.line(margin, y, pageW-margin, y); y += 22;

  labelValueRow('Float Amount:', fmtGHS(float));
  labelValueRow('Amount Spent:', fmtGHS(amountSpent));
  labelValueRow('Cash on Hand:', fmtGHS(cashOnHand));
  if(r.adjustmentAmount){
    labelValueRow('Adjustment:', `-${fmtGHS(r.adjustmentAmount)}${r.adjustmentReason?' — '+r.adjustmentReason:''}`);
  }
  labelValueRow('Reimbursement Amount:', fmtGHS(reimbursementNetAmount(r)));
  y += 22;

  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Sign-off', margin, y); y += 26;

  signLine('Petty Cashier Name', r.requestedBy);
  signLine('Reviewer Name', r.reviewedBy || '');
  signLine('Head of Finance Approval', r.paidBy || '');
  signLine('Managing Director Approval', '');

  doc.setFontSize(8); doc.setTextColor(130);
  doc.text(`Generated ${nowParts().date} ${nowParts().time}`, margin, 800);
  doc.setTextColor(0);

  // ---- PAGE 2: EXPENSES ----
  doc.addPage();
  y = margin;
  header('EXPENSE DETAIL');
  const colX = [margin, margin+55, margin+165, margin+340, margin+430];
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Date', colX[0], y);
  doc.text('Recipient', colX[1], y);
  doc.text('Description', colX[2], y);
  doc.text('Voucher', colX[3], y);
  doc.text('Amount', pageW-margin, y, { align:'right' });
  y += 6;
  doc.setLineWidth(0.5); doc.line(margin, y, pageW-margin, y); y += 14;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  items.forEach(t=>{
    if(y > 780){ doc.addPage(); y = margin; }
    doc.text(String(t.date), colX[0], y);
    doc.text(truncateText(t.recipient,20), colX[1], y);
    doc.text(truncateText(t.description,28), colX[2], y);
    doc.text(String(t.voucher||'—'), colX[3], y);
    doc.text(fmtGHS(t.amount), pageW-margin, y, { align:'right' });
    y += 14;
  });
  y += 6; doc.setLineWidth(0.5); doc.line(margin, y, pageW-margin, y); y += 18;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Amount Spent', colX[2], y);
  doc.text(fmtGHS(amountSpent), pageW-margin, y, { align:'right' });
  if(r.adjustmentAmount){
    y += 16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(`Adjustment${r.adjustmentReason?' — '+r.adjustmentReason:''}`, colX[2], y);
    doc.text(`-${fmtGHS(r.adjustmentAmount)}`, pageW-margin, y, { align:'right' });
    y += 16;
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Reimbursement Amount', colX[2], y);
    doc.text(fmtGHS(reimbursementNetAmount(r)), pageW-margin, y, { align:'right' });
  }

  // ---- PAGE 3: CASH COUNT SUMMARY ----
  doc.addPage();
  y = margin;
  header('CASH COUNT SUMMARY');
  if(c){
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(`Counted by ${c.countedBy} on ${c.date} ${c.time}`, margin, y); y += 22;
    doc.setFont('helvetica','bold');
    doc.text('Denomination', margin, y);
    doc.text('Qty', margin+240, y);
    doc.text('Amount', pageW-margin, y, { align:'right' });
    y += 6; doc.setLineWidth(0.5); doc.line(margin, y, pageW-margin, y); y += 14;
    doc.setFont('helvetica','normal');
    DENOMINATIONS.forEach(d=>{
      const qty = (c.denominations && c.denominations[d.value]) || 0;
      if(qty<=0) return;
      doc.text(d.label, margin, y);
      doc.text(String(qty), margin+240, y);
      doc.text(fmtGHS(d.value*qty), pageW-margin, y, { align:'right' });
      y += 14;
    });
    y += 6; doc.setLineWidth(0.5); doc.line(margin, y, pageW-margin, y); y += 18;
    doc.setFont('helvetica','bold');
    doc.text('Total Counted', margin, y); doc.text(fmtGHS(c.totalCounted), pageW-margin, y, { align:'right' }); y += 16;
    doc.setFont('helvetica','normal');
    doc.text('System Balance (at time of count)', margin, y); doc.text(fmtGHS(c.systemBalance), pageW-margin, y, { align:'right' }); y += 16;
    doc.text('Variance', margin, y); doc.text(fmtGHS(c.variance), pageW-margin, y, { align:'right' }); y += 16;
    if(c.remarks){ y += 10; doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.text(`Remarks: ${c.remarks}`, margin, y); }
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text('No cash count on file.', margin, y);
  }

  doc.save(`${r.id}-Reimbursement-Authorization.pdf`);
}

async function generateReimbursementDocx(r){
  const { Document, Paragraph, TextRun, Table, TableRow, TableCell, AlignmentType, WidthType, PageBreak, Packer, BorderStyle } = window.docx;
  const co = State.settings.company;
  const items = State.transactions.filter(t=>t.reimbursementId===r.id);
  const c = latestCashCount();
  const { currentBalance } = computeLedger();
  const cashOnHand = c ? c.totalCounted : currentBalance;
  const float = State.settings.pettyCash.approvedFloat;
  const amountSpent = r.totalAmount;
  const net = reimbursementNetAmount(r);

  function p(text, opts={}){
    return new Paragraph({ children:[new TextRun({text:String(text), bold:!!opts.bold, italics:!!opts.italics, size:opts.size||20})], spacing:{after:opts.after??120}, alignment:opts.align });
  }
  function labelRow(label, value){
    return new Paragraph({ children:[ new TextRun({text:label+'  ', bold:true, size:20}), new TextRun({text:String(value), size:20}) ], spacing:{after:100} });
  }
  function cell(text, opts={}){
    return new TableCell({ children:[new Paragraph({children:[new TextRun({text:String(text), bold:!!opts.bold, size:18})]})] });
  }
  function table(headers, rows){
    return new Table({
      width:{size:100, type:WidthType.PERCENTAGE},
      rows:[
        new TableRow({ children: headers.map(h=>cell(h,{bold:true})) }),
        ...rows.map(row=>new TableRow({ children: row.map(v=>cell(v)) })),
      ],
    });
  }
  function signBlock(label, name){
    return [
      p('_____________________________               _____________________________', {after:60}),
      p(`${label}${name?': '+name:''}` + '                              Date', {size:18, after:260}),
    ];
  }

  const children = [];

  // ---- PAGE 1: SUMMARY ----
  children.push(new Paragraph({ children:[new TextRun({text:co.name||'Petty Cash', bold:true, size:28})], spacing:{after:60} }));
  if(co.address||co.phone) children.push(p([co.address,co.phone].filter(Boolean).join('   ·   '), {italics:true, size:18, after:160}));
  children.push(new Paragraph({ children:[new TextRun({text:'PETTY CASH REIMBURSEMENT — SUMMARY', bold:true, size:26})], alignment:AlignmentType.CENTER, spacing:{after:300} }));

  children.push(labelRow('Request No.:', r.id));
  children.push(labelRow('Request Date:', r.requestDate));
  children.push(labelRow('Period Covered:', `${r.periodFrom} to ${r.periodTo}`));
  children.push(p('', {after:160}));

  children.push(labelRow('Float Amount:', fmtGHS(float)));
  children.push(labelRow('Amount Spent:', fmtGHS(amountSpent)));
  children.push(labelRow('Cash on Hand:', fmtGHS(cashOnHand)));
  if(r.adjustmentAmount){
    children.push(labelRow('Adjustment:', `-${fmtGHS(r.adjustmentAmount)}${r.adjustmentReason?' — '+r.adjustmentReason:''}`));
  }
  children.push(labelRow('Reimbursement Amount:', fmtGHS(net)));
  children.push(p('', {after:260}));

  children.push(new Paragraph({ children:[new TextRun({text:'Sign-off', bold:true, size:24})], spacing:{after:200} }));
  children.push(...signBlock('Petty Cashier Name', r.requestedBy));
  children.push(...signBlock('Reviewer Name', r.reviewedBy||''));
  children.push(...signBlock('Head of Finance Approval', r.paidBy||''));
  children.push(...signBlock('Managing Director Approval', ''));
  children.push(p(`Generated ${nowParts().date} ${nowParts().time}`, {size:14, italics:true}));

  // ---- PAGE 2: EXPENSES ----
  children.push(new Paragraph({ children:[new PageBreak()] }));
  children.push(new Paragraph({ children:[new TextRun({text:co.name||'Petty Cash', bold:true, size:22})], spacing:{after:60} }));
  children.push(new Paragraph({ children:[new TextRun({text:'EXPENSE DETAIL', bold:true, size:24})], alignment:AlignmentType.CENTER, spacing:{after:260} }));
  children.push(table(
    ['Date','Recipient','Description','Voucher','Amount'],
    items.map(t=>[t.date, t.recipient, t.description, t.voucher||'—', fmtGHS(t.amount)])
  ));
  children.push(p('', {after:160}));
  children.push(labelRow('Amount Spent:', fmtGHS(amountSpent)));
  if(r.adjustmentAmount){
    children.push(labelRow(`Adjustment${r.adjustmentReason?' — '+r.adjustmentReason:''}:`, `-${fmtGHS(r.adjustmentAmount)}`));
    children.push(labelRow('Reimbursement Amount:', fmtGHS(net)));
  }

  // ---- PAGE 3: CASH COUNT SUMMARY ----
  children.push(new Paragraph({ children:[new PageBreak()] }));
  children.push(new Paragraph({ children:[new TextRun({text:co.name||'Petty Cash', bold:true, size:22})], spacing:{after:60} }));
  children.push(new Paragraph({ children:[new TextRun({text:'CASH COUNT SUMMARY', bold:true, size:24})], alignment:AlignmentType.CENTER, spacing:{after:260} }));
  if(c){
    children.push(p(`Counted by ${c.countedBy} on ${c.date} ${c.time}`, {after:160}));
    const denomRows = DENOMINATIONS
      .filter(d=>(c.denominations && c.denominations[d.value]) > 0)
      .map(d=>{ const qty = c.denominations[d.value]; return [d.label, String(qty), fmtGHS(d.value*qty)]; });
    children.push(table(['Denomination','Qty','Amount'], denomRows));
    children.push(p('', {after:160}));
    children.push(labelRow('Total Counted:', fmtGHS(c.totalCounted)));
    children.push(labelRow('System Balance (at time of count):', fmtGHS(c.systemBalance)));
    children.push(labelRow('Variance:', fmtGHS(c.variance)));
    if(c.remarks) children.push(p(`Remarks: ${c.remarks}`, {italics:true}));
  } else {
    children.push(p('No cash count on file.'));
  }

  const docx = new Document({ sections:[{ children }] });
  const blob = await Packer.toBlob(docx);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${r.id}-Reimbursement-Authorization.docx`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function latestCashCount(){
  return State.cashCounts.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0] || null;
}
function reconciliationReady(){
  // Softened: submitting no longer requires a perfectly-balanced count — any
  // cash count on file (with its required remark) is enough. The real
  // control point is now the 10-cedis variance gate on printing/downloading
  // the signed authorization document.
  return !!latestCashCount();
}
function reimbursementPrintBlocked(){
  const c = latestCashCount();
  if(!c) return true; // no cash count on file at all — nothing to base the document on
  return Math.abs(c.variance) > 10;
}
function renderReimbursement(){
  const { currentBalance } = computeLedger();
  const threshold = State.settings.pettyCash.reimbursementThreshold;
  const belowThreshold = currentBalance <= threshold;
  const eligible = eligibleForReimbursement();
  const eligibleTotal = eligible.reduce((s,t)=>s+Number(t.amount||0),0);
  const hasOpenDraft = State.reimbursements.some(r=>r.status==='DRAFT');
  const list = State.reimbursements.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const pendingReview = list.filter(r=>r.status==='SUBMITTED');
  const selectedId = State.activeReimbursementId && list.some(r=>r.id===State.activeReimbursementId)
    ? State.activeReimbursementId
    : (can('reimb.review') && pendingReview.length>0 ? pendingReview[pendingReview.length-1].id : (list[0] ? list[0].id : null));
  State.activeReimbursementId = selectedId;
  const r = selectedId ? State.reimbursements.find(x=>x.id===selectedId) : null;

  return `
  <div class="page-head">
    <h1>Reimbursement</h1>
    <p>Requests draw from unreimbursed transactions since the last payment. A cash count on file is enough to submit — the signed authorization document can only be downloaded once the latest count is within GHS 10 of the system balance.</p>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="label">Current Balance</div><div class="value" style="${belowThreshold?'color:var(--red);':''}">${fmtGHS(currentBalance)}</div></div>
    <div class="stat"><div class="label">Threshold</div><div class="value">${fmtGHS(threshold)}</div></div>
    <div class="stat"><div class="label">Unreimbursed (eligible)</div><div class="value">${fmtGHS(eligibleTotal)}</div><div class="sub">${eligible.length} transaction(s)</div></div>
    <div class="stat"><div class="label">Document Print Gate</div><div class="value" style="font-size:15px;">${reimbursementPrintBlocked() ? `<span class="badge badge-red">BLOCKED (variance &gt; GHS 10)</span>` : `<span class="badge badge-green">CLEAR</span>`}</div></div>
  </div>

  ${can('reimb.create') && !hasOpenDraft ? `
    ${eligible.length===0 ? `<div class="banner banner-info">No unreimbursed transactions to request payment for.</div>` :
      !belowThreshold ? `<div class="banner banner-info">Balance is still above the reimbursement threshold (${fmtGHS(threshold)}). You can still create a request if needed.
        <button type="button" class="btn btn-ghost btn-sm" style="margin-left:10px;" data-action="create-reimbursement">Create Anyway</button></div>` :
      `<div class="banner banner-info">Balance is at or below the reimbursement threshold — a request is due.
        <button type="button" class="btn btn-gold btn-sm" style="margin-left:10px;" data-action="create-reimbursement">Create Reimbursement Request</button></div>`}
  ` : ''}
  ${hasOpenDraft && can('reimb.create') ? `<div class="banner banner-info">A draft request already exists — submit or reject it before creating another.</div>` : ''}

  <div class="toolbar">
    <select id="reimbSelect" ${list.length===0?'disabled':''}>
      ${list.length===0 ? `<option>No reimbursement requests yet</option>` :
        list.map(x=>`<option value="${escapeAttr(x.id)}" ${x.id===selectedId?'selected':''}>${x.status==='SUBMITTED'?'⏳ ':''}${escapeHtml(x.id)} — ${fmtGHS(reimbursementNetAmount(x))} — ${x.status}${x.status==='SUBMITTED'?' (pending your review)':''}</option>`).join('')}
    </select>
    ${r && (r.status==='APPROVED'||r.status==='PAID') ? (
      reimbursementPrintBlocked()
        ? `<span class="badge badge-red" style="align-self:center;">Variance &gt; GHS 10 — perform a fresh Cash Count to unlock the document</span>`
        : `<button type="button" class="btn btn-ghost btn-sm" data-action="print-reimbursement" data-id="${escapeAttr(r.id)}">⬇ Download PDF</button>
           <button type="button" class="btn btn-ghost btn-sm" data-action="download-reimbursement-docx" data-id="${escapeAttr(r.id)}">⬇ Download Word</button>`
    ) : ''}
  </div>

  ${!r ? `<div class="banner banner-info">Create a reimbursement request to see it here.</div>` : renderReimbursementDetail(r)}
  `;
}

/* ---------------- RECONCILIATION ---------------- */
function renderReconciliation(){
  const { currentBalance } = computeLedger();
  const threshold = State.settings.pettyCash.reimbursementThreshold;
  const c = latestCashCount();
  const belowThreshold = currentBalance <= threshold;
  const ready = reconciliationReady();
  const printBlocked = reimbursementPrintBlocked();
  const openReimb = State.reimbursements.filter(r=>!['PAID','REJECTED'].includes(r.status));
  return `
  <div class="page-head">
    <h1>Reconciliation</h1>
    <p>Compares the physical cash count against the system's ledger balance. Submitting a reimbursement only needs a count on file; downloading the signed authorization document needs the variance within GHS 10.</p>
  </div>

function filteredExpenseTxns(){
  const {from, to} = State.reportFilters;
  return State.transactions.filter(t =>
    t.type!=='REIMBURSEMENT' && t.status!=='VOIDED' &&
    (!from || t.date>=from) && (!to || t.date<=to)
  );
}
function toCSV(rows){
  return rows.map(r => r.map(cell => {
    const s = String(cell ?? '');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
}
/* Parses CSV text (supports quoted fields with embedded commas) into
   account rows for the Import Chart of Accounts feature. */
function parseCSVLine(line){
  const cells = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else cur+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ cells.push(cur); cur=''; }
      else cur+=c;
    }
  }
  cells.push(cur);
  return cells;
}
function parseAccountsCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0) return [];
  let start = 0;
  if(/^code\s*,/i.test(lines[0])) start = 1; // skip header row if present
  const out = [];
  for(let i=start;i<lines.length;i++){
    const cells = parseCSVLine(lines[i]);
    const code = (cells[0]||'').trim();
    const name = (cells[1]||'').trim();
    const category = (cells[2]||'').trim();
    const activeRaw = (cells[3]||'true').trim().toLowerCase();
    if(!code || !name) continue;
    out.push({ code, name, category, active: activeRaw!=='false' });
  }
  return out;
}
/* Accepts YYYY-MM-DD or DD/MM/YYYY; returns YYYY-MM-DD or null if unparseable. */
function parseDateFlexible(raw){
  const s = (raw||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    const day = m[1].padStart(2,'0'), month = m[2].padStart(2,'0'), year = m[3];
    return `${year}-${month}-${day}`;
  }
  return null;
}
/* Parses the Upload Transactions CSV: date,recipient,description,department,accountCode,voucher,amount */
function parseTransactionsCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0) return { rows:[], errors:[] };
  let start = 0;
  if(/^date\s*,/i.test(lines[0])) start = 1;
  const rows = [], errors = [];
  for(let i=start;i<lines.length;i++){
    const lineNo = i+1;
    const cells = parseCSVLine(lines[i]);
    const rawDate = (cells[0]||'').trim();
    const recipient = (cells[1]||'').trim();
    const description = (cells[2]||'').trim();
    const department = (cells[3]||'').trim();
    const accountCode = (cells[4]||'').trim();
    const voucher = (cells[5]||'').trim();
    const amount = Number((cells[6]||'').trim());

    const date = parseDateFlexible(rawDate);
    if(!date){ errors.push(`Line ${lineNo}: unrecognized date "${rawDate}" — skipped.`); continue; }
    if(!accountCode){ errors.push(`Line ${lineNo}: missing account code — skipped.`); continue; }
    const account = State.accounts.find(a=>a.code===accountCode && a.active);
    if(!account){ errors.push(`Line ${lineNo}: account code "${accountCode}" not found or inactive — skipped.`); continue; }
    if(!amount || amount<=0){ errors.push(`Line ${lineNo}: invalid amount "${cells[6]||''}" — skipped.`); continue; }

    rows.push({ date, recipient, description, department, accountCode, account, voucher, amount });
  }
  return { rows, errors };
}
/* Formats a JS Date as YYYY-MM-DD using UTC parts, avoiding local-timezone
   day-shifting when SheetJS hands back a Date object for a date cell. */
/* Reads an image file and resizes it (preserving aspect ratio) down to
   maxWidth, returning {dataUrl, width, height} — keeps logos small
   regardless of what the person actually uploads. */
function resizeImageFile(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not load that as an image'));
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: canvas.toDataURL('image/png'), width:w, height:h });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function formatDateUTC(d){
  const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), day = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
/* Parses rows from an uploaded Excel/CSV file (array-of-arrays from SheetJS'
   sheet_to_json with header:1). Cell values may be native types (Date
   objects, numbers) rather than plain text, unlike the pasted-CSV path. */
const TXN_HEADER_ALIASES = {
  date: ['date'],
  recipient: ['recipient','recipient name','payee'],
  description: ['description','description or purpose for payment','purpose'],
  department: ['department','dept'],
  accountCode: ['account code','accountcode','expense account'],
  voucher: ['voucher','voucher no','voucher no.','voucher serial no','voucher serial no.','voucher serial number'],
  amount: ['amount','paid amount','amount paid'],
};
function normalizeHeader(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/\.$/,''); }
/* Maps a header row to column indices by name, so uploads work whether the
   file is the simple template or a full Reports export (extra columns like
   Txn ID, Account Name, Batch, Status, User are simply ignored). */
function mapTxnHeaders(headerRow){
  const normalized = (headerRow||[]).map(normalizeHeader);
  const map = {};
  for(const field in TXN_HEADER_ALIASES){
    for(const alias of TXN_HEADER_ALIASES[field]){
      const idx = normalized.indexOf(alias);
      if(idx !== -1){ map[field] = idx; break; }
    }
  }
  return map;
}
function parseTransactionRows(rowsRaw){
  if(!rowsRaw || rowsRaw.length===0) return { rows:[], errors:[] };

  // Try to detect a real header row by name; fall back to the original
  // fixed column order (Date, Recipient, Description, Department,
  // Account Code, Voucher, Amount) if no recognizable headers are found.
  let colMap = mapTxnHeaders(rowsRaw[0]);
  let start = 0;
  const looksLikeHeader = colMap.date!==undefined && colMap.accountCode!==undefined && colMap.amount!==undefined;
  if(looksLikeHeader){
    start = 1;
  } else {
    colMap = { date:0, recipient:1, description:2, department:3, accountCode:4, voucher:5, amount:6 };
  }

  const rows = [], errors = [];
  for(let i=start;i<rowsRaw.length;i++){
    const r = rowsRaw[i];
    const lineNo = i+1;
    if(!r || r.every(c=>c==='' || c===null || c===undefined)) continue; // skip blank rows
    const get = (field)=> colMap[field]!==undefined ? r[colMap[field]] : '';
    const rawDate = get('date');
    const recipient = String(get('recipient')||'').trim();
    const description = String(get('description')||'').trim();
    const department = String(get('department')||'').trim();
    const accountCode = String(get('accountCode')||'').trim();
    const voucher = String(get('voucher')||'').trim();
    const rawAmount = get('amount');

    let date = null;
    if(rawDate instanceof Date && !isNaN(rawDate)) date = formatDateUTC(rawDate);
    else if(typeof rawDate === 'string') date = parseDateFlexible(rawDate);
    if(!date){ errors.push(`Row ${lineNo}: unrecognized date "${rawDate}" — skipped.`); continue; }

    if(!accountCode){ errors.push(`Row ${lineNo}: missing account code — skipped.`); continue; }
    const account = State.accounts.find(a=>a.code===accountCode && a.active);
    if(!account){ errors.push(`Row ${lineNo}: account code "${accountCode}" not found or inactive — skipped.`); continue; }

    const amount = typeof rawAmount === 'number' ? rawAmount : Number(String(rawAmount||'').replace(/,/g,''));
    if(!amount || amount<=0){ errors.push(`Row ${lineNo}: invalid amount "${rawAmount}" — skipped.`); continue; }

    rows.push({ date, recipient, description, department, accountCode, account, voucher, amount });
  }
  return { rows, errors };
}
function downloadCSV(filename, rows){
  const blob = new Blob([toCSV(rows)], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================= BIND EVENTS ============================= */
function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-nav');
      if(id === 'logout'){ doLogout(); return; }
      const flat = NAV.flatMap(g=>g.items);
      const item = flat.find(i=>i.id===id);
      if(!item) return;
      if(item.phase > 1) return; // locked for now
      if(item.perm && !can(item.perm)) return;
      State.view = id;
      render();
    });
  });

  // search boxes
  bindSearch('acctSearch','accounts');
  bindSearch('userSearch','users');
  bindSearch('auditSearch','audit');
  document.querySelectorAll('[data-action="restore-voided-txn"]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const t = State.transactions.find(x=>x.id===id);
    if(!t || t.status!=='VOIDED') return;
    if(!confirm(`Restore ${id} (${fmtGHS(t.amount)})? It will return to its previous status and count toward the balance again.`)) return;
    const restoredStatus = t.statusBeforeVoid || 'POSTED';
    t.status = restoredStatus;
    const oldReason = t.voidReason;
    delete t.voidReason; delete t.voidedBy; delete t.voidedAt; delete t.statusBeforeVoid;
    const ok = await storeSet(K.transactions, State.transactions);
    if(!ok){
      t.status = 'VOIDED'; t.voidReason = oldReason;
      alert(`⚠️ Could not confirm this was saved (${ConnectionState.lastError}). Try again.`);
      render();
      return;
    }
    if(t.batchNumber) await refreshBatch(t.batchNumber);
    await logAudit('Transaction restored (un-voided)', 'VOIDED', restoredStatus, `${id} — was voided: ${oldReason||''}`);
    render();
  }));
  bindSearch('txnSearch','txn');
  const txnShowAllToggle = document.getElementById('txnShowAllToggle');
  if(txnShowAllToggle){
    txnShowAllToggle.addEventListener('change', ()=>{
      State.txnShowAll = txnShowAllToggle.checked;
      render();
    });
  }
  bindSearch('batchSearch','batches');

  // ---- ledger: multi-row save (existing edited rows + trailing new row) ----
  const ledgerForm = document.getElementById('ledgerForm');
  if(ledgerForm){
    // Enter should feel like Excel: move to the next field in the row, and
    // only actually save once you're on the last field. Previously Enter in
    // ANY field instantly submitted the whole form and redrew the table,
    // which could wipe out a row you hadn't finished typing yet.
    ledgerForm.addEventListener('keydown', (e)=>{
      if(e.key !== 'Enter') return;
      const el = e.target;
      if(el.tagName !== 'INPUT' && el.tagName !== 'SELECT') return;
      e.preventDefault();
      const row = el.closest('tr');
      if(!row) return;
      const fields = Array.from(row.querySelectorAll('input, select'));
      const idx = fields.indexOf(el);
      if(idx > -1 && idx < fields.length - 1){
        fields[idx+1].focus();
      } else {
        ledgerForm.requestSubmit();
      }
    });
    ledgerForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      let touched = false;
      let batchesToRefresh = new Set();

      // 1) save changes to existing editable rows (batch assignment is fixed, not editable here)
      const existingRows = ledgerForm.querySelectorAll('tr[data-row-id]:not([data-row-id="_new"])');
      for(const rowEl of existingRows){
        const id = rowEl.getAttribute('data-row-id');
        const t = State.transactions.find(x=>x.id===id);
        if(!t) continue;
        const get = name => rowEl.querySelector(`[name="${name}"]`)?.value ?? '';
        const accountCode = get('accountCode');
        const amount = Number(get('amount'));
        if(!accountCode || !amount || amount<=0) continue; // incomplete row, skip
        const account = State.accounts.find(a=>a.code===accountCode);
        Object.assign(t, {
          date:get('date'), recipient:get('recipient').trim(), description:get('description').trim(),
          department:get('department'), accountCode, accountName:account.name, accountCategory:account.category||'',
          voucher:get('voucher').trim(), amount,
        });
        touched = true;
        if(t.batchNumber) batchesToRefresh.add(t.batchNumber);
      }

      // 2) create a new transaction from the trailing blank row, if filled in — always
      //    filed under the current Working Batch, never chosen per line.
      const newRowEl = ledgerForm.querySelector('tr[data-row-id="_new"]');
      if(newRowEl){
        const b = activeBatch();
        if(!b){ alert('Select or start a batch before entering transactions.'); }
        else {
          const get = name => newRowEl.querySelector(`[name="${name}"]`)?.value ?? '';
          const accountCode = get('accountCode');
          const amount = Number(get('amount'));
          if(accountCode && amount>0){
            const account = State.accounts.find(a=>a.code===accountCode);
            const dupe = State.transactions.find(t => t.status!=='VOIDED' && t.date===get('date') &&
              Number(t.amount)===amount && (t.recipient||'').toLowerCase()===get('recipient').trim().toLowerCase() && t.accountCode===accountCode);
            let proceed = true;
            if(dupe) proceed = confirm(`A similar transaction already exists (${dupe.id}, ${dupe.date}, ${fmtGHS(dupe.amount)} to ${dupe.recipient}). Save this row anyway?`);
            if(proceed){
              const id = await nextNumber('txn');
              const {date, time, iso} = nowParts();
              const t = {
                id, type:'EXPENSE', date:get('date'), recipient:get('recipient').trim(), description:get('description').trim(),
                department:get('department'), accountCode, accountName:account.name, accountCategory:account.category||'',
                batchNumber:b.batchNumber, voucher:get('voucher').trim(), amount, status:'DRAFT',
                userId:State.currentUser.id, userName:State.currentUser.fullName, dateCreated:date, timeCreated:time, createdAt:iso,
              };
              State.transactions.push(t);
              touched = true;
              batchesToRefresh.add(b.batchNumber);
              await logAudit('Transaction created', '—', `${id} — ${fmtGHS(amount)} — ${account.name} — Batch ${b.batchNumber}`);
            }
          }
        }
      }

      if(touched){
        await storeSet(K.transactions, State.transactions);
        for(const bn of batchesToRefresh) await refreshBatch(bn);
      }
      render();
    });
  }

  // ---- working batch selector ----
  document.querySelectorAll('[data-action="use-working-batch"]').forEach(b=>b.addEventListener('click', ()=>{
    const sel = document.getElementById('workingBatchSelect');
    if(!sel || !sel.value){ alert('Choose a batch from the list first.'); return; }
    State.activeBatchNumber = sel.value;
    render();
  }));
  document.querySelectorAll('[data-action="change-working-batch"]').forEach(b=>b.addEventListener('click', ()=>{
    State.activeBatchNumber = '';
    render();
  }));
  document.querySelectorAll('[data-action="open-start-new-batch"]').forEach(b=>b.addEventListener('click', ()=>{
    State.modal = {type:'start-new-batch'};
    render();
  }));
  const startNewBatchForm = document.getElementById('startNewBatchForm');
  if(startNewBatchForm){
    startNewBatchForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(startNewBatchForm);
      const dateVal = fd.get('date');
      const cashOnHand = Number(fd.get('cashOnHand'));
      const reimbAmount = Number(fd.get('reimbAmount'))||0;
      const previousBatch = fd.get('previousBatch');
      if(cashOnHand===null || isNaN(cashOnHand) || cashOnHand<0){ alert('Enter a valid Cash on Hand amount (0 or more).'); return; }

      const batchNumber = await nextNumber('batch');
      const nb = {
        batchNumber, batchDate: dateVal,
        preparedBy: State.currentUser.fullName, preparedById: State.currentUser.id,
        numTransactions:0, totalAmount:0, status:'DRAFT',
        reviewedBy:'', approvedBy:'', postingDate:'', accountingReference:'', postedBy:'',
        remarks: previousBatch ? `Follows batch ${previousBatch}` : '',
      };
      State.batches.push(nb);
      const okBatch = await storeSet(K.batches, State.batches);
      if(!okBatch){
        State.batches.pop();
        alert(`⚠️ Could not confirm the batch was saved (${ConnectionState.lastError}). Nothing was created — try again.`);
        render();
        return;
      }
      await logAudit('Batch created', '—', batchNumber);
      State.activeBatchNumber = batchNumber;

      // Cash on Hand — sets the starting balance for this batch
      const {date, time, iso} = nowParts();
      const cohId = await nextNumber('txn');

          render();
          return;
        }

    const confirmText = prompt(`This permanently removes all ${count} transaction(s) currently in ${bn}, so you can upload a corrected list. This cannot be undone.\n\nType CLEAR to confirm:`);
    if(confirmText !== 'CLEAR') return;

    const before = State.transactions;
    State.transactions = State.transactions.filter(t=>t.batchNumber!==bn);
    batch.numTransactions = 0;
    batch.totalAmount = 0;
    const ok1 = await storeSet(K.transactions, State.transactions);

    await logAudit('Batch cleared for re-upload', `${count} transaction(s)`, '0 transactions', `Batch ${bn}`);

      const fd = new FormData(addLateTxnForm);

      const accountCode = fd.get('accountCode');
      const account = State.accounts.find(a=>a.code===accountCode);

      const id = await nextNumber('txn');

        const denom = Number(inp.getAttribute('data-denom'));
        const qty = Number(inp.value)||0;
        const line = denom*qty;

        const lineCell = cashCountForm.querySelector(`[data-denom-line="${denom}"]`);

      const totalDisplay = document.getElementById('cashCountTotalDisplay');
      if(totalDisplay) totalDisplay.textContent = fmtGHS(total);
      const variance = total - systemBalance;
      const varDisplay = document.getElementById('cashCountVarianceDisplay');
      if(varDisplay){
        varDisplay.textContent = fmtGHS(variance);
        varDisplay.style.color = Math.abs(variance)>tolerance ? 'var(--red)' : 'var(--green)';
